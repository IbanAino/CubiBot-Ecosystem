async_slam_toolbox_node:
  ros__parameters:

    # Input/Output topics
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint # CORRIGÉ (était base_footprint par défaut, correspond à votre URDF)
    scan_topic: /scan

    # Plugin de calcul
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSED_SCHUR
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_max_dist: 12.0
    odom_max_ang: 1.571
    map_update_interval: 0.5

    # 1. Ajustement des capacités du LiDAR
    max_laser_range: 12.0 # CORRIGÉ (était 20.0, correspond à votre matériel)
    min_laser_range: 0.10 # CORRIGÉ (était 0.0)
    max_laser_angle: 3.14159
    min_laser_angle: -3.14159

    # 2. Tolérance temporelle pour vider la file d'attente (Queue)
    transform_timeout: 0.5
    transform_tolerance: 0.1 # CORRIGÉ (était 0.01, absorbe la latence WiFi)

    # Général SLAM Parameters
    mode: mapping # mapping, localization
    debug_logging: false
    throttle_scans: 1
    map_to_odom_transform_publish_period: 0.05
    use_scan_matching: true
    use_scan_barycenter: true

    # Scan Matcher Parameters
    minimum_time_interval: 0.05
    loop_search_maximum_distance: 10.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0  
    loop_match_minimum_response_coarse: 0.35
    loop_match_maximum_variance_fine: 0.03
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.03

    # Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Buffer Parameters
    scan_buffer_size: 60
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_coarse: 0.1
    link_scan_maximum_distance: 1.5

    # Coarse Search Parameters
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # Map Generation Parameters
    resolution: 0.05
    
    # 3. Augmente la mémoire des TFs conservées pour laisser le temps au nœud de faire le lien
    tf_buffer_duration: 30.0

